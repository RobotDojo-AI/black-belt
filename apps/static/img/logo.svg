<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Friendly robot in a gi — placeholder, replace with final design -->
  <!-- Body (gi/kimono shape) -->
  <path d="M20 28 L32 24 L44 28 L42 52 L22 52 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Belt -->
  <rect x="22" y="38" width="20" height="3" rx="1" fill="#3b82f6"/>
  <!-- Belt knot -->
  <path d="M32 41 L29 46 M32 41 L35 46" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gi lapel -->
  <path d="M32 24 L26 34 M32 24 L38 34" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <!-- Head -->
  <rect x="24" y="10" width="16" height="14" rx="4" fill="#e0e7ff" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="29" cy="17" r="2" fill="#3b82f6"/>
  <circle cx="35" cy="17" r="2" fill="#3b82f6"/>
  <!-- Eye shine -->
  <circle cx="30" cy="16" r="0.7" fill="#fff"/>
  <circle cx="36" cy="16" r="0.7" fill="#fff"/>
  <!-- Antenna -->
  <line x1="32" y1="10" x2="32" y2="5" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="2" fill="#60a5fa"/>
  <!-- Arms -->
  <path d="M20 30 L14 38" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 30 L50 38" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="13" cy="39" r="2.5" fill="#e0e7ff" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="51" cy="39" r="2.5" fill="#e0e7ff" stroke="#3b82f6" stroke-width="1"/>
  <!-- Feet -->
  <rect x="23" y="52" width="7" height="4" rx="2" fill="#e0e7ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="34" y="52" width="7" height="4" rx="2" fill="#e0e7ff" stroke="#3b82f6" stroke-width="1"/>
</svg>
