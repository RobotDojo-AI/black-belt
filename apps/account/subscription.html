<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Belt Access - Robot Dojo</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/account/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body class="account-page">
  <main class="account-shell" style="max-width: 720px; margin: 8vh auto; padding: 24px;">
    <section class="acct-card">
      <div class="acct-card-header">
        <div class="acct-card-icon"><span class="material-symbols-outlined">workspace_premium</span></div>
        <div class="acct-card-title">
          <div class="acct-card-name">Black Belt access</div>
          <div class="acct-card-service">Private beta uses issued or prepaid keys.</div>
        </div>
      </div>
      <p class="feature-request-help">
        Checkout is not part of the beta surface. Open Account to manage local setup,
        integrations, and keys.
      </p>
      <div class="acct-form-actions">
        <a class="acct-form-submit" href="/account/admin">Open Account</a>
      </div>
    </section>
  </main>
</body>
</html>
