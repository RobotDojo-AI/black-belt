<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <title>Dojo — Viewer</title>
  <link rel="stylesheet" href="/static/shared/theme.css">
  <link rel="stylesheet" href="/viewer/style.css?v=viewer-rich-20260819-2">
  <link rel="stylesheet" href="/static/vendor/fonts.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>body{opacity:0}body.app-ready{opacity:1;transition:opacity 80ms ease}</style>
  <script>
    (() => {
      function escBoot(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[c]));
      }
      function classifyBootError(message) {
        const msg = String(message || '');
        if (/SyntaxError|Identifier .* already been declared|Unexpected token/i.test(msg)) {
          return 'RDJ_VIEWER_SCRIPT_PARSE';
        }
        if (/Failed to fetch|NetworkError|ERR_|Load failed/i.test(msg)) {
          return 'RDJ_VIEWER_ASSET_NETWORK';
        }
        return 'RDJ_VIEWER_SCRIPT_ERROR';
      }
      function rememberBootError(event, fallbackMessage) {
        const message = event?.message || event?.reason?.message || event?.error?.message || fallbackMessage || 'Unknown script failure';
        window.RobotDojoLastBootError = {
          code: classifyBootError(message),
          message,
          source: event?.filename || event?.reason?.stack || '',
        };
      }
      window.addEventListener('error', (event) => rememberBootError(event, 'Viewer script error'), true);
      window.addEventListener('unhandledrejection', (event) => rememberBootError(event, 'Viewer promise rejected'), true);
      window.RobotDojoBootFallback = setTimeout(() => {
        if (!document.body || document.body.classList.contains('app-ready')) return;
        document.body.classList.add('app-ready', 'app-boot-fallback');
        const detail = window.RobotDojoLastBootError || {
          code: 'RDJ_VIEWER_BOOT_TIMEOUT',
          message: 'Viewer app did not mark itself ready within 8 seconds.',
          source: location.pathname,
        };
        const fallback = document.createElement('div');
        fallback.className = 'rd-boot-fallback rd-error viewer-error';
        fallback.setAttribute('data-error-code', detail.code);
        fallback.setAttribute('role', 'alert');
        fallback.innerHTML = `
          <div class="viewer-error-title">Robot Dojo Viewer did not finish loading.</div>
          <code class="viewer-error-code">${escBoot(detail.code)}</code>
          <div class="viewer-error-message">${escBoot(detail.message)}</div>
          ${detail.source ? `<div class="viewer-error-detail">${escBoot(detail.source)}</div>` : ''}
          <div class="viewer-error-action">Refresh after reconnecting. If it repeats, send the code above.</div>
        `;
        document.body.prepend(fallback);
      }, 8000);
    })();
  </script>
</head>
<body data-app="viewer">
  <div class="app-body">
    <div class="main" id="mainArea">
      <main id="viewerContent" class="viewer-content"></main>
    </div>
  </div>

  <script src="/viewer/app.js?v=2026-09-09-2"></script>
</body>
</html>
